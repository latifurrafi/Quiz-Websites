# Daffodil AI Club quiz.
#
#   docker compose up --build       start it (first run builds the image)
#                                   then open http://localhost:8080
#   docker compose down             stop it, keeping all data
#   docker compose down -v          stop it and ERASE questions + results
#
# Every setting below has a working default, so `git clone` then
# `docker compose up` is enough. Override any of them in a .env file
# next to this one -- see .env.example.

services:
  quiz:
    build: .
    image: aiclub-quiz
    container_name: aiclub-quiz
    restart: unless-stopped
    ports:
      - "${QUIZ_PORT:-8080}:8000"
    environment:
      # Fine for a laptop on a club LAN. Generate a real one before ever
      # putting this on the public internet -- see README.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-key-change-before-public-hosting}
      DJANGO_DEBUG: "0"
      # "*" lets other devices reach it by your machine's IP address.
      # Narrow this to your domain if you ever host it publicly.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      # The admin account, created on first start only. An existing
      # account is never modified, so changing this later does nothing.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-aiclub-admin-2026}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    volumes:
      # Questions and results live here, outside the image, so rebuilding
      # or updating the code never loses them.
      - quiz-data:/app/data

volumes:
  quiz-data:
