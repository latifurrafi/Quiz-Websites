# Render blueprint — https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New → Blueprint → pick this repo. Render reads
# this file and sets everything up. You will be asked for the two values
# marked `sync: false` so they never live in git.
#
# Before deploying, create a free Postgres at https://neon.com and copy its
# connection string — Render's own free Postgres expires after 30 days,
# Neon's free plan does not.

services:
  - type: web
    name: aiclub-quiz
    runtime: python
    plan: free
    # Closest region to Bangladesh. Others: oregon, ohio, virginia, frankfurt.
    region: singapore
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -"
    healthCheckPath: /
    envVars:
      # Django 6.1 needs Python 3.12+. If the build complains that this exact
      # version is unavailable, change it to another 3.13.x in the dashboard.
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Render generates this once and keeps it. Never commit a real key.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "0"

      # Render terminates TLS, so the HTTPS hardening is safe to switch on.
      - key: DJANGO_SECURE_HTTPS
        value: "1"

      # Paste your Neon connection string when prompted.
      # Without it the app refuses to start, because Render's disk is wiped
      # on every restart and a SQLite file there would lose every result.
      - key: DATABASE_URL
        sync: false

      - key: DJANGO_SUPERUSER_USERNAME
        value: admin

      # Prompted for on deploy, so it stays out of the repository. Leave it
      # blank and one is generated and printed in the build log instead.
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
